<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F0F1A" />
    </radialGradient>

    <!-- Text Gradient (Epic) -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Key Gradient -->
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2D44" />
      <stop offset="100%" stop-color="#1A1A2E" />
    </linearGradient>

    <!-- Key Highlight Gradient -->
    <linearGradient id="keyHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter for Text -->
    <filter id="glowText" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for Keys -->
    <filter id="shadowKey" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Subtle Background Grid (Keyboard inspiration) -->
  <g opacity="0.05" stroke="#38BDF8" stroke-width="2">
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
  </g>

  <!-- Keyboard Section -->
  <g transform="translate(266, 420)">
    <!-- Row 1 (Bottom) -->
    <g filter="url(#shadowKey)">
      <rect x="-220" y="0" width="50" height="50" rx="10" fill="url(#keyGrad)" stroke="#3D3D5C" stroke-width="2" />
      <rect x="-150" y="0" width="50" height="50" rx="10" fill="url(#keyGrad)" stroke="#3D3D5C" stroke-width="2" />
      <!-- Spacebar -->
      <rect x="-50" y="0" width="100" height="50" rx="10" fill="url(#keyGrad)" stroke="#3D3D5C" stroke-width="2" />
      <rect x="50" y="0" width="50" height="50" rx="10" fill="url(#keyGrad)" stroke="#3D3D5C" stroke-width="2" />
      <!-- Enter Key -->
      <rect x="120" y="0" width="80" height="50" rx="10" fill="url(#keyGrad)" stroke="#3D3D5C" stroke-width="2" />
    </g>

    <!-- Row 2 -->
    <g filter="url(#shadowKey)">
      <rect x="-180" y="-70" width="50" height="50" rx="10" fill="url(#keyGrad)" stroke="#3D3D5C" stroke-width="2" />
      <rect x="-110" y="-70" width="50" height="50" rx="10" fill="url(#keyGrad)" stroke="#3D3D5C" stroke-width="2" />
      <rect x="-30" y="-70" width="50" height="50" rx="10" fill="url(#keyGrad)" stroke="#3D3D5C" stroke-width="2" />
      <rect x="50" y="-70" width="50" height="50" rx="10" fill="url(#keyGrad)" stroke="#3D3D5C" stroke-width="2" />
    </g>

    <!-- Row 3 -->
    <g filter="url(#shadowKey)">
      <rect x="-140" y="-140" width="50" height="50" rx="10" fill="url(#keyGrad)" stroke="#3D3D5C" stroke-width="2" />
      <rect x="-70" y="-140" width="50" height="50" rx="10" fill="url(#keyGrad)" stroke="#3D3D5C" stroke-width="2" />
      <rect x="0" y="-140" width="50" height="50" rx="10" fill="url(#keyGrad)" stroke="#3D3D5C" stroke-width="2" />
      <rect x="70" y="-140" width="50" height="50" rx="10" fill="url(#keyGrad)" stroke="#3D3D5C" stroke-width="2" />
    </g>

    <!-- Row 4 (Top) -->
    <g filter="url(#shadowKey)">
      <rect x="-100" y="-210" width="50" height="50" rx="10" fill="url(#keyGrad)" stroke="#3D3D5C" stroke-width="2" />
      <rect x="-30" y="-210" width="50" height="50" rx="10" fill="url(#keyGrad)" stroke="#3D3D5C" stroke-width="2" />
      <rect x="40" y="-210" width="50" height="50" rx="10" fill="url(#keyGrad)" stroke="#3D3D5C" stroke-width="2" />
    </g>

    <!-- Glowing Key Accents -->
    <g>
      <!-- Bottom Row Accents -->
      <rect x="-215" y="5" width="10" height="4" rx="2" fill="url(#keyHighlight)" />
      <rect x="-145" y="5" width="10" height="4" rx="2" fill="url(#keyHighlight)" />
      <rect x="-45" y="5" width="10" height="4" rx="2" fill="url(#keyHighlight)" />
      <rect x="55" y="5" width="10" height="4" rx="2" fill="url(#keyHighlight)" />
      <rect x="130" y="5" width="10" height="4" rx="2" fill="url(#keyHighlight)" />
      
      <!-- Row 2 Accents -->
      <rect x="-175" y="-65" width="10" height="4" rx="2" fill="url(#keyHighlight)" />
      <rect x="-105" y="-65" width="10" height="4" rx="2" fill="url(#keyHighlight)" />
      <rect x="-25" y="-65" width="10" height="4" rx="2" fill="url(#keyHighlight)" />
      <rect x="55" y="-65" width="10" height="4" rx="2" fill="url(#keyHighlight)" />
      
      <!-- Row 3 Accents -->
      <rect x="-135" y="-135" width="10" height="4" rx="2" fill="url(#keyHighlight)" />
      <rect x="-65" y="-135" width="10" height="4" rx="2" fill="url(#keyHighlight)" />
      <rect x="5" y="-135" width="10" height="4" rx="2" fill="url(#keyHighlight)" />
      <rect x="75" y="-135" width="10" height="4" rx="2" fill="url(#keyHighlight)" />
    </g>
  </g>

  <!-- "Epic" Text -->
  <text x="256" y="260" 
        font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" 
        font-weight="900" 
        font-size="140" 
        text-anchor="middle" 
        fill="url(#textGrad)" 
        filter="url(#glowText)"
        letter-spacing="-4">
    Epic
  </text>

  <!-- Subtle Reflection/Shadow for the Text -->
  <text x="256" y="265" 
        font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" 
        font-weight="900" 
        font-size="140" 
        text-anchor="middle" 
        fill="#0F0F1A" 
        opacity="0.3"
        letter-spacing="-4">
    Epic
  </text>
</svg>